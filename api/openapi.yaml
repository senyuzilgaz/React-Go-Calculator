openapi: 3.1.0

info:
  title: Calculator API
  version: 1.0.0
  description: |
    REST API exposing arithmetic operations for the calculator frontend.

    This document is the **complete contract** for the service and is written before any
    implementation exists. It is maintained by hand as documentation; no client or server code
    is generated from it (see `docs/DECISIONS.md`, ADR-0005 and ADR-0014).

    ## Design notes

    - Operations are addressed as resources: `POST /api/v1/operations/{op}`.
    - `GET /api/v1/operations` returns the operation catalog, which is the runtime source of
      truth for operation metadata. The frontend renders its operator keys from it.
    - Request bodies use a uniform `operands` array rather than named parameters, so unary and
      binary operations share one request shape (ADR-0002).
    - **Operands are sent as JSON numbers; `result` is returned as a JSON string.** The server
      owns the rounding policy, so the returned string is the canonical display form and clients
      render it verbatim without re-parsing or re-formatting it (ADR-0003).
    - The service is stateless. Nothing is persisted and no calculation history exists.

    ## Rounding policy

    All arithmetic is performed in IEEE-754 binary64. Results are rounded to **12 significant
    decimal digits**, round-half-to-even, before serialization. Decimal notation is used for
    `1e-9 <= |value| < 1e12` and for zero; scientific notation outside that band. Trailing zeros
    are stripped and negative zero is rendered as `0`.

    This masks accumulated representation error (`0.1 + 0.2` returns `"0.3"`, not
    `"0.30000000000000004"`) but does not eliminate it. Square root and exponentiation are
    approximate by nature. See ADR-0003 for the full policy and its stated limitations.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Operations
    description: Discovery and execution of arithmetic operations.
  - name: Health
    description: Liveness probing.

paths:

  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 whenever the process is able to serve requests.
      responses:
        '200':
          description: The service is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok

  /api/v1/operations:
    get:
      tags: [Operations]
      operationId: listOperations
      summary: Operation catalog
      description: |
        Returns every operation the service supports, including its display symbol, arity,
        parameter roles, and execution endpoint.

        This endpoint is the runtime contract for operation metadata. The frontend fetches it on
        mount and renders its operator keys from the response, so adding an operation is a
        backend-only change (ADR-0009). The catalog is generated from the same registry that
        drives routing and arity validation, so it cannot drift from actual behaviour.
      responses:
        '200':
          description: The full operation catalog.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationCatalog'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/operations/{op}:
    parameters:
      - name: op
        in: path
        required: true
        description: |
          Identifier of the operation to execute, as published in the catalog's `id` field.
          An unrecognised value returns `404 UNKNOWN_OPERATION`.
        schema:
          $ref: '#/components/schemas/OperationId'
    post:
      tags: [Operations]
      operationId: executeOperation
      summary: Execute an operation
      description: |
        Applies the named operation to the supplied operands and returns the rounded result.

        The required operand count is the `arity` published for the operation in the catalog:
        `2` for every operation except `sqrt`, which takes `1`. A mismatch returns
        `400 WRONG_OPERAND_COUNT`.

        Note: OpenAPI cannot express per-operation arity on a single path whose operation is a
        path parameter, so the schema below permits 1 or 2 operands and the exact count is
        enforced by the server against the registry. This is a limitation of documenting the
        shape, not of the validation.

        `Content-Type` is not enforced; the body is parsed as JSON regardless. Request bodies
        are size-limited, and a body exceeding the limit is reported as `400 INVALID_JSON`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
            examples:
              addition:
                summary: 0.1 + 0.2 — the rounding policy in action
                value:
                  operands: [0.1, 0.2]
              division:
                summary: 10 ÷ 4
                value:
                  operands: [10, 4]
              squareRoot:
                summary: √9 — unary, one operand
                value:
                  operands: [9]
              exponentiation:
                summary: 2 ^ 10
                value:
                  operands: [2, 10]
              percentage:
                summary: 15 percent of 200
                value:
                  operands: [15, 200]
      responses:
        '200':
          description: The operation was applied successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
              examples:
                addition:
                  summary: 0.1 + 0.2 returns "0.3", not "0.30000000000000004"
                  value:
                    operation: add
                    operands: [0.1, 0.2]
                    result: "0.3"
                division:
                  summary: 10 ÷ 4
                  value:
                    operation: divide
                    operands: [10, 4]
                    result: "2.5"
                recurring:
                  summary: 1 ÷ 3, rounded to 12 significant digits
                  value:
                    operation: divide
                    operands: [1, 3]
                    result: "0.333333333333"
                scientific:
                  summary: A magnitude beyond 1e12 switches to scientific notation
                  value:
                    operation: multiply
                    operands: [123456789, 987654321]
                    result: "1.21932631113e+17"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  headers:
    XRequestId:
      description: |
        Correlation identifier for the request. Echoed from the inbound `X-Request-Id` header
        when present, otherwise generated by the server. Present on every response and included
        in every log line for the request.
      schema:
        type: string
      example: 01J9ZC8N2K4QWERTY0123456789

  schemas:

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok

    OperationId:
      type: string
      description: |
        Stable identifier of an operation. Enumerated here to document the operations available
        at the time of writing; the catalog endpoint is authoritative at runtime.
      enum:
        - add
        - subtract
        - multiply
        - divide
        - power
        - sqrt
        - percent

    OperationParameter:
      type: object
      description: One positional operand, described by the role it plays in the operation.
      required: [name, description]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Role name of the operand at this position.
          examples: [dividend, divisor, radicand, exponent]
        description:
          type: string
          description: Human-readable explanation, suitable for a tooltip or label.

    Operation:
      type: object
      required: [id, name, symbol, arity, parameters, endpoint]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        name:
          type: string
          description: Display name of the operation.
          examples: [Division]
        symbol:
          type: string
          description: Display symbol for the keypad key.
          examples: ["÷"]
        arity:
          type: integer
          description: Exact number of operands required. Enforced server-side.
          enum: [1, 2]
        parameters:
          type: array
          description: |
            Operand roles in positional order. Length always equals `arity`.
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/OperationParameter'
        endpoint:
          type: string
          description: Path at which this operation is executed.
          examples: ["/api/v1/operations/divide"]

    OperationCatalog:
      type: object
      required: [operations]
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Operation'
      examples:
        - operations:
            - id: add
              name: Addition
              symbol: "+"
              arity: 2
              parameters:
                - name: augend
                  description: The value added to.
                - name: addend
                  description: The value added.
              endpoint: /api/v1/operations/add
            - id: subtract
              name: Subtraction
              symbol: "−"
              arity: 2
              parameters:
                - name: minuend
                  description: The value subtracted from.
                - name: subtrahend
                  description: The value subtracted.
              endpoint: /api/v1/operations/subtract
            - id: multiply
              name: Multiplication
              symbol: "×"
              arity: 2
              parameters:
                - name: multiplicand
                  description: The value multiplied.
                - name: multiplier
                  description: The number of times it is taken.
              endpoint: /api/v1/operations/multiply
            - id: divide
              name: Division
              symbol: "÷"
              arity: 2
              parameters:
                - name: dividend
                  description: The value divided.
                - name: divisor
                  description: The value divided by. Must not be zero.
              endpoint: /api/v1/operations/divide
            - id: power
              name: Exponentiation
              symbol: "^"
              arity: 2
              parameters:
                - name: base
                  description: The value raised to a power.
                - name: exponent
                  description: The power the base is raised to.
              endpoint: /api/v1/operations/power
            - id: sqrt
              name: Square root
              symbol: "√"
              arity: 1
              parameters:
                - name: radicand
                  description: The value whose square root is taken. Must not be negative.
              endpoint: /api/v1/operations/sqrt
            - id: percent
              name: Percentage
              symbol: "%"
              arity: 2
              parameters:
                - name: percentage
                  description: The percentage to take.
                - name: value
                  description: The value the percentage is taken of.
              endpoint: /api/v1/operations/percent

    Operand:
      type: number
      format: double
      description: |
        A finite IEEE-754 binary64 value. `NaN` and `±Infinity` are not representable in JSON
        and are rejected as `400 INVALID_OPERAND` if supplied by any other encoding.

    CalculationRequest:
      type: object
      required: [operands]
      additionalProperties: false
      properties:
        operands:
          type: array
          description: |
            Positional operands, in the order given by the operation's `parameters` in the
            catalog. The exact required length is the operation's `arity`.
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Operand'

    CalculationResponse:
      type: object
      required: [operation, operands, result]
      additionalProperties: false
      properties:
        operation:
          $ref: '#/components/schemas/OperationId'
        operands:
          type: array
          description: The operands as received, echoed for traceability.
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Operand'
        result:
          type: string
          description: |
            The result, already rounded per the service's rounding policy and formatted for
            display. **Returned as a string, not a number**, so that the server's rounding
            decision survives transport intact — JSON numbers are re-parsed as binary64 by
            browsers, which would reintroduce the representation error the policy removes.
            Clients render this value verbatim.
          examples: ["0.3", "2.5", "0.333333333333", "1.21932631113e+17", "0"]

    ErrorCode:
      type: string
      description: |
        Machine-readable classification of a failure. Clients switch on this value; the
        accompanying `message` is for humans and logs and must not be parsed.
      enum:
        - INVALID_JSON
        - INVALID_OPERAND
        - WRONG_OPERAND_COUNT
        - UNKNOWN_OPERATION
        - METHOD_NOT_ALLOWED
        - DIVISION_BY_ZERO
        - NEGATIVE_SQRT
        - RESULT_OVERFLOW
        - INTERNAL_ERROR

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                Human-readable explanation. Never contains internal error text, stack traces,
                or implementation detail.

  responses:

    BadRequest:
      description: |
        The request could not be used as sent: the body is not valid JSON, an operand is not a
        finite number, or the operand count does not match the operation's arity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidJson:
              summary: Body is not parseable JSON, or exceeds the size limit
              value:
                error:
                  code: INVALID_JSON
                  message: Request body is not valid JSON
            invalidOperand:
              summary: An operand is not a finite number
              value:
                error:
                  code: INVALID_OPERAND
                  message: Operand at position 1 is not a finite number
            wrongOperandCount:
              summary: Two operands sent to a unary operation
              value:
                error:
                  code: WRONG_OPERAND_COUNT
                  message: Operation 'sqrt' requires exactly 1 operand, received 2

    NotFound:
      description: No operation exists with the identifier given in the path.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNKNOWN_OPERATION
              message: "Unknown operation 'modulo'"

    MethodNotAllowed:
      description: |
        The path exists but does not support the method used. Emitted by the router.
      headers:
        Allow:
          description: Methods the path does support.
          schema:
            type: string
          example: POST
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: Method GET is not supported for this resource

    UnprocessableEntity:
      description: |
        The request was well-formed and the operands were valid, but the computation is
        mathematically undefined or its result is not representable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            divisionByZero:
              summary: Divisor is zero
              value:
                error:
                  code: DIVISION_BY_ZERO
                  message: Cannot divide by zero
            negativeSqrt:
              summary: Square root of a negative value
              value:
                error:
                  code: NEGATIVE_SQRT
                  message: Cannot take the square root of a negative number
            resultOverflow:
              summary: Result exceeds the representable range, e.g. 1e308 ^ 2
              value:
                error:
                  code: RESULT_OVERFLOW
                  message: Result is too large to represent

    InternalError:
      description: An unexpected fault occurred. The response carries no internal detail.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
